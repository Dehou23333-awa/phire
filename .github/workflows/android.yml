name: android-apk

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build arm64 apk
    runs-on: ubuntu-latest
    env:
      # Tag of TeamFlos/prpr-avc-ffmpeg that provides the prebuilt ffmpeg
      # static libs for each target. phire's default `video` feature links
      # prpr-avc, which needs them.
      AVC_TAG: 20260408_v0
    steps:
      - uses: actions/checkout@v4

      # phire-ui/build.rs runs dotenv_build on the workspace-root .env. A
      # default (non-`closed`) build needs no variables, but the file has to
      # exist, so create an empty one.
      - name: Provide empty .env
        run: touch .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image ships the Android SDK and cmdline-tools already;
      # the setup-android action trips over a `sdkmanager tools` quirk, so use
      # the preinstalled sdkmanager directly.
      - name: Set up Android NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # The runner already ships an NDK and exports ANDROID_NDK_ROOT.
          # Only install one when it is missing, and keep the two variables in
          # agreement (cargo-ndk warns and prefers ANDROID_NDK_ROOT otherwise).
          if [ -n "${ANDROID_NDK_ROOT:-}" ] && [ -d "${ANDROID_NDK_ROOT}" ]; then
            echo "using preinstalled NDK: ${ANDROID_NDK_ROOT}"
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
          else
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
            echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: 'true'
          cache-all-crates: 'true'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # prpr-avc/build.rs looks for ffmpeg under <crate>/static-lib/<TARGET>/,
      # which is gitignored because the binaries are large. The official
      # prpr-avc-ffmpeg release ships one flat tarball per target.
      - name: Fetch ffmpeg static libs
        run: |
          set -euo pipefail
          for target in aarch64-linux-android; do
            dest="prpr-avc/static-lib/$target"
            mkdir -p "$dest"
            curl -fsSL --retry 3 \
              "https://github.com/TeamFlos/prpr-avc-ffmpeg/releases/download/${AVC_TAG}/${target}.tar.gz" \
              -o "/tmp/${target}.tar.gz"
            tar -xzf "/tmp/${target}.tar.gz" -C "$dest"
            echo "== $dest"; ls -la "$dest"
          done
          # Static libraries only fail at dlopen time, so a mismatched ffmpeg
          # build produces a green CI and an app that dies on launch with
          # UnsatisfiedLinkError. prpr-avc's FFI expects these symbols.
          for sym in swr_alloc_set_opts swr_convert avcodec_open2 avformat_open_input; do
            if ! nm -g --defined-only prpr-avc/static-lib/aarch64-linux-android/*.a 2>/dev/null | grep -qw "$sym"; then
              echo "::error::$sym missing from the ffmpeg static libs (tag ${AVC_TAG})"
              exit 1
            fi
          done
          echo "ffmpeg symbol check passed" 

      - name: Build libphire_ui.so
        run: |
          set -euo pipefail
          cargo ndk \
            -t aarch64-linux-android \
            -o ./android/app/src/main/jniLibs \
            build --release -p phire-ui
          find ./android/app/src/main/jniLibs -name '*.so' -exec ls -la {} \;

      # libphire_ui.so links libc++_shared.so (pulled in by oboe/C++ deps) but
      # Gradle does not bundle it, so the app would die with an
      # UnsatisfiedLinkError on launch. Copy it out of the NDK.
      # Only arm64-v8a is shipped: NDK 27 no longer ships libc++_shared.so for
      # armeabi-v7a, and every current device is arm64.
      - name: Bundle libc++_shared.so
        run: |
          set -euo pipefail
          for abi in arm64-v8a; do
            case "$abi" in
              arm64-v8a) triple=aarch64-linux-android ;;
            esac
            src=$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -path "*/$triple/libc++_shared.so" | head -1)
            if [ -z "$src" ]; then
              echo "libc++_shared.so not found for $triple under $ANDROID_NDK_HOME" >&2
              exit 1
            fi
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "$src" "android/app/src/main/jniLibs/$abi/libc++_shared.so"
            echo "== $abi (from $src)"
            ls -la "android/app/src/main/jniLibs/$abi"
          done

      - name: Assemble APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$(find android/app/build/outputs/apk -name '*.apk' | head -1)" \
            dist/phira-android-arm64-v8a.apk
          ls -la dist
          # .so payload + apk size, handy when comparing against the official build
          unzip -l dist/phira-android-arm64-v8a.apk | grep -E '\.so$' || true

      - uses: actions/upload-artifact@v4
        with:
          name: phira-android-apk
          path: dist/*.apk
          if-no-files-found: error